name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      app:
        description: "빌드할 앱 폴더 이름 (apps/ 아래)"
        required: true
        default: "sample-timer"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f "apps/${{ inputs.app }}/requirements.txt" ]; then
            pip install -r "apps/${{ inputs.app }}/requirements.txt"
          fi

      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "${{ inputs.app }}" \
            "apps/${{ inputs.app }}/main.py"

      - name: Package (macOS)
        if: matrix.label == 'macos'
        shell: bash
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "${{ inputs.app }}.app" "${{ inputs.app }}.zip"
          rm -rf "${{ inputs.app }}.app" "${{ inputs.app }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
