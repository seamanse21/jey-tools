<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>영단어 퀴즈</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
}

.hidden {
  display: none !important;
}

body {
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Trebuchet MS", system-ui, sans-serif;
  background: linear-gradient(160deg, #fff2cc 0%, #ffe0e9 40%, #d9f2ff 100%);
  min-height: 100vh;
  color: #333;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
}

/* ---------- 레벨 · 카테고리 선택 ---------- */
.top-controls {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 50;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  max-width: calc(100vw - 32px);
}

.level-select {
  position: relative;
}

.level-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  border: 3px solid #ffb84d;
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 16px;
  font-weight: 700;
  color: #d9720a;
  cursor: pointer;
  box-shadow: 0 4px 0 #ffb84d;
}

.level-btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #ffb84d;
}

.category-btn {
  border-color: #6bc5f8;
  color: #2f8fd1;
  box-shadow: 0 4px 0 #6bc5f8;
}

.category-btn:active {
  box-shadow: 0 2px 0 #6bc5f8;
}

.level-arrow {
  font-size: 14px;
}

.level-menu {
  list-style: none;
  margin: 8px 0 0;
  padding: 6px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  width: 250px;
  overflow: hidden;
}

.level-menu.hidden {
  display: none;
}

.level-menu li {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  color: #555;
  cursor: pointer;
}

.level-menu li:hover,
.level-menu li.active {
  background: #ffe8b3;
  color: #d9720a;
}

/* ---------- 타이틀 ---------- */
.app-title {
  margin: 96px 0 8px;
  font-size: 26px;
  font-weight: 800;
  color: #555;
  text-align: center;
}

@media (min-width: 560px) {
  .app-title { margin-top: 56px; }
}

/* ---------- 퀴즈 영역 ---------- */
.quiz-area {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.progress-label {
  font-size: 14px;
  color: #999;
  font-weight: 600;
  margin-bottom: 10px;
}

.word-card {
  width: 100%;
  min-height: 340px;
  background: #ffffff;
  border-radius: 28px;
  box-shadow: 0 10px 0 #e9e9e9, 0 14px 30px rgba(0,0,0,0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  cursor: pointer;
  position: relative;
  transition: transform 0.08s ease;
}

.word-card:active {
  transform: scale(0.98);
}

.idiom-badge {
  position: absolute;
  top: 16px;
  left: 16px;
  background: #7cd6c4;
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
}

.idiom-badge.hidden {
  display: none;
}

.word-text {
  font-size: 88px;
  font-weight: 800;
  color: #333;
  text-align: center;
  overflow-wrap: break-word;
  word-break: break-word;
  line-height: 1.2;
}

.reveal-area {
  margin-top: 22px;
  text-align: center;
}

.reveal-area.hidden {
  display: none;
}

.ipa-text {
  font-size: 40px;
  color: #ff8fa3;
  font-weight: 700;
  margin-bottom: 10px;
}

.meaning-text {
  font-size: 44px;
  color: #4a90d9;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: break-word;
}

.example-area {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 2px dashed #ffe0b3;
}

.example-area.hidden {
  display: none;
}

.example-en {
  font-size: 22px;
  font-style: italic;
  font-weight: 600;
  color: #555;
  line-height: 1.45;
  overflow-wrap: break-word;
}

.example-ko {
  font-size: 18px;
  color: #999;
  font-weight: 600;
  margin-top: 6px;
  line-height: 1.4;
}

.tap-hint {
  margin-top: 20px;
  font-size: 14px;
  color: #bbb;
  font-weight: 600;
}

/* ---------- 컨트롤 버튼 ---------- */
.controls {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 20px;
  width: 100%;
}

.round-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: #ffd166;
  font-size: 24px;
  box-shadow: 0 4px 0 #e0a934;
  cursor: pointer;
  flex-shrink: 0;
}

.round-btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #e0a934;
}

.next-btn {
  flex: 1;
  height: 56px;
  border: none;
  border-radius: 18px;
  background: #6bc5f8;
  color: #ffffff;
  font-size: 18px;
  font-weight: 800;
  box-shadow: 0 4px 0 #3fa1da;
  cursor: pointer;
}

.next-btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #3fa1da;
}

/* ---------- 점수판 ---------- */
.scoreboard {
  width: 100%;
  max-width: 480px;
  margin-top: 32px;
  background: #ffffff;
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

.scoreboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 17px;
  font-weight: 800;
  color: #555;
  margin-bottom: 12px;
}

.mini-btn {
  border: none;
  background: #f2f2f2;
  color: #888;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
}

.team-list {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 12px;
}

.team-row {
  position: relative;
  flex: 1 1 0;
  min-width: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  background: #fafafa;
  border-radius: 18px;
  padding: 18px 12px 14px;
}

.team-name {
  width: 100%;
  border: none;
  background: transparent;
  font-size: 16px;
  font-weight: 700;
  color: #444;
  padding: 6px;
  min-width: 0;
  text-align: center;
}

.team-name:focus {
  outline: 2px solid #ffd166;
  border-radius: 8px;
}

.team-score-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.team-score-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: none;
  font-size: 22px;
  font-weight: 800;
  cursor: pointer;
  flex-shrink: 0;
}

.team-score-minus {
  background: #ffe3e3;
  color: #e3595a;
}

.team-score-plus {
  background: #dff5e0;
  color: #3fa15a;
}

.team-score {
  width: 64px;
  text-align: center;
  font-size: 40px;
  font-weight: 800;
  color: #333;
  cursor: pointer;
  flex-shrink: 0;
}

.team-remove {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: #ccc;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}

.add-team-btn {
  margin-top: 12px;
  width: 100%;
  height: 46px;
  border: 2px dashed #ffd166;
  border-radius: 14px;
  background: transparent;
  color: #d9720a;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

@media (max-width: 380px) {
  .word-text { font-size: 56px; }
  .ipa-text { font-size: 28px; }
  .meaning-text { font-size: 30px; }
  .app-title { font-size: 22px; }
}


/* 도구 모음으로 돌아가기 (jey-tools) */
.jey-back{position:fixed;left:12px;bottom:12px;z-index:9999;font-size:12px;opacity:.5;
  text-decoration:none;color:inherit;padding:6px 10px;border-radius:8px;
  background:rgba(128,128,128,.14);backdrop-filter:blur(4px)}
.jey-back:hover,.jey-back:focus-visible{opacity:1}
@media print{.jey-back{display:none}}
</style>
</head>

  <a class="jey-back" href="./index.html">← Jey Tools</a>

  <!-- 좌측 상단 레벨 · 카테고리 선택 -->
  <div class="top-controls">
    <div class="level-select">
      <button id="levelBtn" class="level-btn">
        <span id="levelLabel">초등 2학년</span>
        <span class="level-arrow">▾</span>
      </button>
      <ul id="levelMenu" class="level-menu hidden">
        <li data-level="2">초등 2학년</li>
        <li data-level="3">초등 3학년</li>
        <li data-level="4">초등 4학년</li>
        <li data-level="5">초등 5학년</li>
        <li data-level="6">초등 6학년</li>
        <li data-level="adult">성인</li>
      </ul>
    </div>

    <div class="level-select" id="categorySelect">
      <button id="categoryBtn" class="level-btn category-btn">
        <span id="categoryLabel">전체</span>
        <span class="level-arrow">▾</span>
      </button>
      <ul id="categoryMenu" class="level-menu hidden"></ul>
    </div>
  </div>

  <h1 class="app-title">영단어 퀴즈</h1>

  <main class="quiz-area">
    <div id="progress" class="progress-label"></div>

    <div id="wordCard" class="word-card">
      <div class="idiom-badge hidden" id="idiomBadge">숙어</div>
      <div id="wordText" class="word-text">apple</div>
      <div id="revealArea" class="reveal-area hidden">
        <div id="ipaText" class="ipa-text"></div>
        <div id="meaningText" class="meaning-text"></div>
        <div id="exampleArea" class="example-area hidden">
          <div id="exampleEn" class="example-en"></div>
          <div id="exampleKo" class="example-ko"></div>
        </div>
      </div>
      <div class="tap-hint" id="tapHint">화면을 터치해서 뜻 보기 👆</div>
    </div>

    <div class="controls">
      <button id="soundBtn" class="round-btn" title="발음 듣기">🔊</button>
      <button id="nextBtn" class="next-btn">다음 단어 ➜</button>
    </div>
  </main>

  <!-- 점수판 -->
  <section class="scoreboard" id="scoreboard">
    <div class="scoreboard-header">
      <span>점수판</span>
      <button id="resetScoreBtn" class="mini-btn" title="점수 초기화">↺ 초기화</button>
    </div>
    <div id="teamList" class="team-list"></div>
    <button id="addTeamBtn" class="add-team-btn">+ 참가자 추가</button>
  </section>

    { en: "I used to ~", ko: "예전에 ~하곤 했습니다", type: "pattern", example_en: "I used to live in Busan.", example_ko: "저는 예전에 부산에 살았습니다." },

  <script>
(() => {
  const STORAGE_KEY = "wordquiz_state_v1";

  const levelBtn = document.getElementById("levelBtn");
  const levelLabel = document.getElementById("levelLabel");
  const levelMenu = document.getElementById("levelMenu");
  const categorySelect = document.getElementById("categorySelect");
  const categoryBtn = document.getElementById("categoryBtn");
  const categoryLabel = document.getElementById("categoryLabel");
  const categoryMenu = document.getElementById("categoryMenu");
  const wordCard = document.getElementById("wordCard");
  const wordText = document.getElementById("wordText");
  const idiomBadge = document.getElementById("idiomBadge");
  const revealArea = document.getElementById("revealArea");
  const ipaText = document.getElementById("ipaText");
  const meaningText = document.getElementById("meaningText");
  const exampleArea = document.getElementById("exampleArea");
  const exampleEn = document.getElementById("exampleEn");
  const exampleKo = document.getElementById("exampleKo");
  const tapHint = document.getElementById("tapHint");
  const soundBtn = document.getElementById("soundBtn");
  const nextBtn = document.getElementById("nextBtn");
  const progressLabel = document.getElementById("progress");
  const teamList = document.getElementById("teamList");
  const addTeamBtn = document.getElementById("addTeamBtn");
  const resetScoreBtn = document.getElementById("resetScoreBtn");

  const LEVEL_NAMES = {
    2: "초등 2학년",
    3: "초등 3학년",
    4: "초등 4학년",
    5: "초등 5학년",
    6: "초등 6학년",
    adult: "성인",
  };

  const CATEGORY_META = {
    word: { label: "단어", color: "#7cd6c4" },
    idiom: { label: "숙어", color: "#7cd6c4" },
    phrasal: { label: "구동사", color: "#a78bfa" },
    pattern: { label: "회화 패턴", color: "#6bc5f8" },
    business: { label: "비즈니스 회화", color: "#ff9776" },
  };

  const WORD_SIZE_STEPS = [
    { max: 9, size: 88 },
    { max: 13, size: 70 },
    { max: 18, size: 58 },
    { max: 26, size: 46 },
    { max: 36, size: 36 },
    { max: 50, size: 28 },
    { max: Infinity, size: 22 },
  ];

  const MEANING_SIZE_STEPS = [
    { max: 6, size: 44 },
    { max: 12, size: 36 },
    { max: 20, size: 28 },
    { max: 32, size: 24 },
    { max: Infinity, size: 20 },
  ];

  let state = loadState();
  let currentLevel = String(state.level || "2");
  let currentCategory = state.category || "all";
  let currentWord = null;
  let lastWordEn = null;
  let revealed = false;
  let voices = [];

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      level: "2",
      category: "all",
      teams: [
        { name: "참가자 1", score: 0 },
        { name: "참가자 2", score: 0 },
      ],
    };
  }

  function saveState() {
    state.level = currentLevel;
    state.category = currentCategory;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function scaleFont(el, len, steps) {
    const step = steps.find((s) => len <= s.max);
    el.style.fontSize = step.size + "px";
  }

  if (!state.teams || state.teams.length === 0) {
    state.teams = [
      { name: "참가자 1", score: 0 },
      { name: "참가자 2", score: 0 },
    ];
  }

  // ---------- 발음 ----------
  // 1) 구글 사전 원어민 음원 → 2) 구글 번역 TTS(자연스러운 합성음) → 3) 기기 내장 음성
  function loadVoices() {
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if (window.speechSynthesis) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  let currentAudio = null;

  function cleanForSpeech(text) {
    return text
      .replace(/~/g, " something ")
      .replace(/\.\.\./g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function speakWithDevice(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = 0.95;
    utter.pitch = 1;
    const preferred = [
      "Samantha", "Google US English", "Ava", "Allison", "Alex", "Karen", "Daniel",
    ];
    const enVoices = voices.filter((v) => v.lang && v.lang.startsWith("en"));
    const pick =
      enVoices.find((v) => preferred.some((n) => v.name.includes(n))) ||
      enVoices.find((v) => v.lang === "en-US") ||
      enVoices[0];
    if (pick) utter.voice = pick;
    window.speechSynthesis.speak(utter);
  }

  function buildAudioSources(raw) {
    const text = cleanForSpeech(raw);
    const list = [];
    // 한 단어이면 구글 사전의 실제 원어민 녹음을 먼저 시도
    if (/^[a-zA-Z']+$/.test(text)) {
      const w = encodeURIComponent(text.toLowerCase());
      list.push("https://ssl.gstatic.com/dictionary/static/sounds/oxford/" + w + "--_us_1.mp3");
      list.push("https://ssl.gstatic.com/dictionary/static/sounds/20220808/" + w + "--_us_1.mp3");
    }
    // 문장·숙어는 구글 번역 TTS
    list.push(
      "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=" +
        encodeURIComponent(text.slice(0, 190))
    );
    return { list, text };
  }

  function speak(raw) {
    if (!raw) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.src = "";
      currentAudio = null;
    }

    const { list, text } = buildAudioSources(raw);
    let idx = 0;

    const tryNext = () => {
      if (idx >= list.length) {
        speakWithDevice(text);
        return;
      }
      const audio = new Audio();
      audio.preload = "auto";
      currentAudio = audio;
      let done = false;

      const fail = () => {
        if (done) return;
        done = true;
        audio.onerror = audio.oncanplay = null;
        tryNext();
      };

      audio.oncanplay = () => {
        if (done) return;
        done = true;
        const p = audio.play();
        // 자동재생이 막힌 경우에만 기기 음성으로 대체
        if (p && p.catch) p.catch(() => speakWithDevice(text));
      };
      audio.onerror = fail;
      // 음원 서버가 응답하지 않으면 다음 방법으로
      setTimeout(() => {
        if (!done && audio.readyState === 0) fail();
      }, 2500);

      audio.src = list[idx++];
      audio.load();
    };

    tryNext();
  }

  // ---------- 레벨 · 카테고리 선택 ----------
  function buildCategoryMenu() {
    const types = Array.from(new Set(WORD_DATA[currentLevel].map((w) => w.type)));
    categoryMenu.innerHTML = "";

    if (types.length <= 1) {
      categorySelect.classList.add("hidden");
      currentCategory = "all";
      return;
    }

    categorySelect.classList.remove("hidden");
    if (!types.includes(currentCategory) && currentCategory !== "all") {
      currentCategory = "all";
    }

    const allLi = document.createElement("li");
    allLi.dataset.category = "all";
    allLi.textContent = "전체";
    categoryMenu.appendChild(allLi);

    types.forEach((t) => {
      const li = document.createElement("li");
      li.dataset.category = t;
      li.textContent = CATEGORY_META[t] ? CATEGORY_META[t].label : t;
      categoryMenu.appendChild(li);
    });
  }

  function refreshCategoryLabel() {
    categoryLabel.textContent =
      currentCategory === "all" ? "전체" : (CATEGORY_META[currentCategory] ? CATEGORY_META[currentCategory].label : currentCategory);
    Array.from(categoryMenu.children).forEach((li) => {
      li.classList.toggle("active", li.dataset.category === currentCategory);
    });
  }

  function setLevel(level) {
    currentLevel = level;
    levelLabel.textContent = LEVEL_NAMES[level];
    Array.from(levelMenu.children).forEach((li) => {
      li.classList.toggle("active", li.dataset.level === level);
    });
    buildCategoryMenu();
    refreshCategoryLabel();
    saveState();
    pickNewWord();
  }

  function setCategory(category) {
    currentCategory = category;
    refreshCategoryLabel();
    saveState();
    pickNewWord();
  }

  levelBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    categoryMenu.classList.add("hidden");
    levelMenu.classList.toggle("hidden");
  });

  levelMenu.addEventListener("click", (e) => {
    const li = e.target.closest("li[data-level]");
    if (!li) return;
    setLevel(li.dataset.level);
    levelMenu.classList.add("hidden");
  });

  categoryBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    levelMenu.classList.add("hidden");
    categoryMenu.classList.toggle("hidden");
  });

  categoryMenu.addEventListener("click", (e) => {
    const li = e.target.closest("li[data-category]");
    if (!li) return;
    setCategory(li.dataset.category);
    categoryMenu.classList.add("hidden");
  });

  document.addEventListener("click", () => {
    levelMenu.classList.add("hidden");
    categoryMenu.classList.add("hidden");
  });

  // ---------- 단어 카드 ----------
  function getPool() {
    const all = WORD_DATA[currentLevel];
    if (currentCategory === "all") return all;
    return all.filter((w) => w.type === currentCategory);
  }

  function pickNewWord() {
    const pool = getPool();
    let candidate;
    if (pool.length === 1) {
      candidate = pool[0];
    } else {
      do {
        candidate = pool[Math.floor(Math.random() * pool.length)];
      } while (candidate.en === lastWordEn);
    }
    currentWord = candidate;
    lastWordEn = candidate.en;
    revealed = false;
    renderWord();
  }

  function renderWord() {
    wordText.textContent = currentWord.en;
    scaleFont(wordText, currentWord.en.length, WORD_SIZE_STEPS);

    const badgeMeta = CATEGORY_META[currentWord.type];
    const showBadge = currentWord.type !== "word" && badgeMeta;
    idiomBadge.classList.toggle("hidden", !showBadge);
    if (showBadge) {
      idiomBadge.textContent = badgeMeta.label;
      idiomBadge.style.background = badgeMeta.color;
    }

    revealArea.classList.add("hidden");
    tapHint.classList.remove("hidden");

    const levelName = LEVEL_NAMES[currentLevel];
    const catName = currentCategory === "all" ? "" : ` · ${CATEGORY_META[currentCategory] ? CATEGORY_META[currentCategory].label : currentCategory}`;
    progressLabel.textContent = `${levelName}${catName}`;

    if (currentWord.ipa) {
      ipaText.textContent = `/${currentWord.ipa}/`;
      ipaText.style.display = "block";
    } else {
      ipaText.textContent = "";
      ipaText.style.display = "none";
    }

    meaningText.textContent = currentWord.ko;
    scaleFont(meaningText, currentWord.ko.length, MEANING_SIZE_STEPS);

    if (currentWord.example_en) {
      exampleEn.textContent = currentWord.example_en;
      exampleKo.textContent = currentWord.example_ko || "";
      exampleArea.classList.remove("hidden");
    } else {
      exampleArea.classList.add("hidden");
    }
  }

  function revealWord() {
    if (revealed) return;
    revealed = true;
    revealArea.classList.remove("hidden");
    tapHint.classList.add("hidden");
    speak(currentWord.en);
  }

  wordCard.addEventListener("click", revealWord);

  soundBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    speak(currentWord.en);
  });

  nextBtn.addEventListener("click", () => {
    pickNewWord();
  });

  // ---------- 점수판 ----------
  function renderTeams() {
    teamList.innerHTML = "";
    state.teams.forEach((team, idx) => {
      const row = document.createElement("div");
      row.className = "team-row";

      const nameInput = document.createElement("input");
      nameInput.className = "team-name";
      nameInput.value = team.name;
      nameInput.addEventListener("change", () => {
        state.teams[idx].name = nameInput.value.trim() || `참가자 ${idx + 1}`;
        saveState();
      });

      const minusBtn = document.createElement("button");
      minusBtn.className = "team-score-btn team-score-minus";
      minusBtn.textContent = "−";
      minusBtn.addEventListener("click", () => {
        state.teams[idx].score -= 1;
        saveState();
        renderTeams();
      });

      const scoreEl = document.createElement("div");
      scoreEl.className = "team-score";
      scoreEl.textContent = team.score;
      scoreEl.title = "클릭하면 점수가 올라가요";
      scoreEl.addEventListener("click", () => {
        state.teams[idx].score += 1;
        saveState();
        renderTeams();
      });

      const plusBtn = document.createElement("button");
      plusBtn.className = "team-score-btn team-score-plus";
      plusBtn.textContent = "+";
      plusBtn.addEventListener("click", () => {
        state.teams[idx].score += 1;
        saveState();
        renderTeams();
      });

      const removeBtn = document.createElement("button");
      removeBtn.className = "team-remove";
      removeBtn.textContent = "✕";
      removeBtn.style.visibility = state.teams.length > 1 ? "visible" : "hidden";
      removeBtn.addEventListener("click", () => {
        state.teams.splice(idx, 1);
        saveState();
        renderTeams();
      });

      const scoreControls = document.createElement("div");
      scoreControls.className = "team-score-controls";
      scoreControls.appendChild(minusBtn);
      scoreControls.appendChild(scoreEl);
      scoreControls.appendChild(plusBtn);

      row.appendChild(removeBtn);
      row.appendChild(nameInput);
      row.appendChild(scoreControls);
      teamList.appendChild(row);
    });
  }

  addTeamBtn.addEventListener("click", () => {
    state.teams.push({ name: `참가자 ${state.teams.length + 1}`, score: 0 });
    saveState();
    renderTeams();
  });

  resetScoreBtn.addEventListener("click", () => {
    state.teams.forEach((t) => (t.score = 0));
    saveState();
    renderTeams();
  });

  // ---------- 초기화 ----------
  setLevel(currentLevel);
  renderTeams();
})();

</script>
</body>
</html>
