  </g>

  <!-- 부리 확대: 네 가지 모양을 나란히 -->
  <g transform="translate(0 206)">
    <g transform="translate(70 0)">
      <circle cx="0" cy="12" r="19" fill="#fff" stroke="#b9cfc4" stroke-width="2.5"/>
