<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -13 480 265" width="480" height="265" role="img" aria-label="부리 모양이 서로 다른 네 마리 핀치">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff0f6"/><stop offset="1" stop-color="#eef7ee"/>
    </linearGradient>
  </defs>
  <rect x="0" y="-13" width="480" height="265" fill="url(#sky)"/>
  <!-- 먼 섬과 바다 -->
  <path d="M0 150h480v40H0z" fill="#cfe6e4"/>
  <path d="M300 150c14-30 28-44 44-44s30 14 44 44z" fill="#b9d6c6"/>
  <path d="M388 150c10-22 20-32 32-32s22 10 32 32z" fill="#a8c9b6"/>
  <circle cx="64" cy="18" r="22" fill="#ffe9b5"/>
  <!-- 땅 -->
