    <g transform="translate(428 0)">
      <circle cx="0" cy="12" r="19" fill="#fff" stroke="#b9cfc4" stroke-width="2.5"/>
      <path d="M12 9l-26 3 26 4z" fill="#4f4840"/>
    </g>
    <path d="M94 12h74M216 12h74M338 12h66" stroke="#b9cfc4" stroke-width="2.5" stroke-dasharray="5 5"/>
  </g>
</svg>
