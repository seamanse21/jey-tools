  <path d="M120 182l-16-16M250 182l14-14M372 182l-12-15" stroke="#9c7c52" stroke-width="5" stroke-linecap="round"/>

  <!-- 새 네 마리: 왼쪽에서 오른쪽으로 부리가 가늘어진다 -->
  <!-- 1 굵고 짧은 부리 -->
  <g transform="translate(70 120)">
