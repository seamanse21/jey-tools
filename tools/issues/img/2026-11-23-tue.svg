    <path d="M-6 43l-2 12M7 43l2 12" stroke="#4a4038" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- 4 뾰족한 부리 -->
  <g transform="translate(428 128)">
    <ellipse cx="0" cy="20" rx="24" ry="19" fill="#93826f"/>
