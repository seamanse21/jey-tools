    <path d="M-6 50l-2 12M8 50l2 12" stroke="#4a4038" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <!-- 2 중간 부리 -->
  <g transform="translate(192 124)">
    <ellipse cx="0" cy="24" rx="28" ry="22" fill="#7a6a5c"/>
    <circle cx="-13" cy="1" r="15.5" fill="#897a6b"/>
