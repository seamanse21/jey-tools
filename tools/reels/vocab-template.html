<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="_fonts.css">
<style>
:root{ --cat:#2f7fd1; --cream:#fdf6e8; --navy:#22304a; --orange:#f08c2e; --ink:#2b2a24; }
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:"Gowun Dodum",sans-serif;color:var(--ink)}
.sc{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 90px;text-align:center}
.jua{font-family:"Jua",sans-serif;line-height:1.26}

/* 1 훅 */
#s1{background:#000}
#s1 .ph{position:absolute;inset:0;background:url(photo2.jpg) center/cover;filter:brightness(.40) saturate(1.05)}
#s1 .in{position:relative;transform:translateY(-70px)}
#s1 .pill{display:inline-block;background:var(--cat);color:#fff;font-family:"Jua",sans-serif;
  font-size:40px;padding:12px 34px;border-radius:999px;margin-bottom:44px}
#s1 h1{font-size:104px;color:#fff;letter-spacing:-.02em}

/* 2 오늘의 낱말 */
#s2{background:var(--cream)}
#s2 .lab{font-family:"Jua",sans-serif;font-size:44px;color:var(--cat);margin-bottom:34px}
#s2 .wbox{position:relative;display:inline-block;padding:0 18px}
#s2 .mark{position:absolute;left:0;bottom:16px;height:46px;width:0;
  background:rgba(47,127,209,.22);border-radius:6px}
#s2 .w{position:relative;font-family:"Jua",sans-serif;font-size:200px;color:var(--ink);line-height:1.1}
#s2 .mean{font-size:54px;color:#6b6a60;margin-top:44px;line-height:1.55}
#s2 .ex{font-size:44px;color:#9a978c;margin-top:34px}
#s2 .ex b{color:var(--cat);font-weight:400}

/* 3 기사 한 조각 */
#s3{background:var(--navy)}
#s3 .q{font-family:"Jua",sans-serif;font-size:76px;color:#fff;line-height:1.5}
#s3 .q em{font-style:normal;color:#ffd79a}
#s3 .yr{font-family:"Jua",sans-serif;font-size:150px;color:var(--orange);margin-bottom:40px;line-height:1}

/* 4 사자성어 */
#s4{background:var(--cat)}
#s4 .lab{font-family:"Jua",sans-serif;font-size:42px;color:#cfe4f8;margin-bottom:46px}
#s4 .han{display:flex;gap:26px}
#s4 .han span{font-family:"Jua",sans-serif;font-size:160px;color:#fff;line-height:1;
  opacity:0;display:inline-block}
#s4 .rd{font-family:"Jua",sans-serif;font-size:62px;color:#fff;margin-top:40px}
#s4 .mn{font-size:48px;color:#dcecfb;margin-top:28px;line-height:1.5}

/* 5 CTA */
#s5{background:var(--orange)}
#s5 .m{margin-bottom:54px}
#s5 .h{font-family:"Jua",sans-serif;font-size:96px;color:#fff;line-height:1.3}
#s5 .d{font-size:52px;color:#fff6e7;margin-top:34px}
#s5 .f{position:absolute;bottom:520px;font-family:"Jua",sans-serif;font-size:46px;color:#fff}
</style></head><body>

<div class="sc" id="s1">
  <div class="ph"></div>
  <div class="in">
    <div class="pill">사회</div>
    <h1 class="jua">추수감사절은<br>왜 생겼을까?</h1>
  </div>
</div>

<div class="sc" id="s2">
  <div class="lab">오늘의 낱말</div>
  <div class="wbox"><span class="mark"></span><span class="w">수확</span></div>
  <div class="mean">익은 곡식이나 열매를<br>거두어들이는 일</div>
  <div class="ex">가을은 <b>수확</b>의 계절이에요</div>
</div>

<div class="sc" id="s3">
  <div class="yr">1620</div>
  <div class="q jua">바다를 건너온 사람들이<br>첫 <em>수확</em>을 거둔 뒤<br>함께 밥을 나눈 날</div>
</div>

<div class="sc" id="s4">
  <div class="lab">오늘의 사자성어</div>
  <div class="han"><span>結</span><span>草</span><span>報</span><span>恩</span></div>
  <div class="rd">결초보은</div>
  <div class="mn">풀을 묶어서라도<br>은혜를 갚는다는 뜻</div>
</div>

<div class="sc" id="s5">
  <div class="m">
    <svg width="190" height="190" viewBox="0 0 64 64">
      <path d="M32 6.5v7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="32" cy="7" r="3.4" fill="#fff"/>
      <rect x="12" y="15" width="40" height="36" rx="11" fill="#fff"/>
      <circle cx="24.6" cy="30.5" r="4.2" fill="#e8891f"/><circle cx="40.4" cy="30.5" r="4.2" fill="#e8891f"/>
      <rect x="25" y="43" width="14" height="3.6" rx="1.8" fill="#e8891f"/>
      <rect x="6" y="28" width="5" height="11" rx="2.5" fill="#fff"/>
      <rect x="53" y="28" width="5" height="11" rx="2.5" fill="#fff"/>
    </svg>
  </div>
  <div class="h">하루 10분,<br>한 장으로 읽는 뉴스</div>
  <div class="d">프로필 링크에서 1주일치 14쪽 무료</div>
  <div class="f">@10minkids · 10minkids.com</div>
</div>

<script>
const E = x => Math.min(1, Math.max(0, x));
const easeOut     = x => 1 - Math.pow(1-x, 3);
const easeOutBack = x => { const c1=2.0, c3=c1+1;
  return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const ramp = (t,a,b) => E((t-a)/(b-a));

const SC = [
  {el:'s1', a:0.00,  b:2.60},
  {el:'s2', a:2.60,  b:7.00},
  {el:'s3', a:7.00,  b:10.20},
  {el:'s4', a:10.20, b:13.40},
  {el:'s5', a:13.40, b:15.00},
];
const XF = 0.18;

function seek(t){
  SC.forEach(s=>{
    const el=document.getElementById(s.el);
    let o=0;
    if(t >= s.a-XF && t <= s.b+0.01){
      o = E(Math.min(ramp(t, s.a-XF, s.a+XF*0.6), 1 - ramp(t, s.b-XF, s.b)));
    }
    el.style.opacity=o;
  });

  /* 1 훅 — 0.5초 안에 다 읽힌다 */
  {
    const p=easeOut(ramp(t,0.02,0.50));
    const inn=document.querySelector('#s1 .in');
    inn.style.opacity=p;
    inn.style.transform='translateY('+(-70+46*(1-p))+'px)';
    document.querySelector('#s1 .ph').style.transform='scale('+(1+0.07*ramp(t,0,2.6))+')';
  }

  /* 2 낱말 — 글자가 뜨고 형광펜이 그어진다 */
  {
    const a=2.60;
    const lab=easeOut(ramp(t,a,a+0.35));
    document.querySelector('#s2 .lab').style.opacity=lab;
    const k=easeOutBack(ramp(t,a+0.15,a+0.80));
    const w=document.querySelector('#s2 .w');
    w.style.transform='scale('+(0.7+0.3*k)+')';
    w.style.opacity=E(ramp(t,a+0.15,a+0.45));
    /* 형광펜은 왼쪽에서 오른쪽으로 */
    const m=easeOut(ramp(t,a+0.75,a+1.35));
    document.querySelector('#s2 .mark').style.width=(m*100)+'%';
    const mn=easeOut(ramp(t,a+1.15,a+1.75));
    const me=document.querySelector('#s2 .mean');
    me.style.opacity=mn; me.style.transform='translateY('+(20-20*mn)+'px)';
    const ex=easeOut(ramp(t,a+1.60,a+2.20));
    const ee=document.querySelector('#s2 .ex');
    ee.style.opacity=ex; ee.style.transform='translateY('+(18-18*ex)+'px)';
  }

  /* 3 기사 한 조각 — 연도 먼저, 문장은 뒤에 */
  {
    const a=7.00;
    const y=easeOutBack(ramp(t,a,a+0.60));
    const yr=document.querySelector('#s3 .yr');
    yr.style.opacity=E(ramp(t,a,a+0.35));
    yr.style.transform='scale('+(0.75+0.25*y)+')';
    const q=easeOut(ramp(t,a+0.40,a+1.10));
    const qq=document.querySelector('#s3 .q');
    qq.style.opacity=q; qq.style.transform='translateY('+(26-26*q)+'px)';
  }

  /* 4 사자성어 — 한 글자씩 떨어진다 */
  {
    const a=10.20;
    document.querySelector('#s4 .lab').style.opacity=easeOut(ramp(t,a,a+0.35));
    document.querySelectorAll('#s4 .han span').forEach((el,i)=>{
      const s0=a+0.25+i*0.16;
      const k=easeOutBack(ramp(t,s0,s0+0.50));
      el.style.opacity=E(ramp(t,s0,s0+0.25));
      el.style.transform='translateY('+(-34*(1-k))+'px) scale('+(0.8+0.2*k)+')';
    });
    const r=easeOut(ramp(t,a+1.05,a+1.55));
    const rd=document.querySelector('#s4 .rd');
    rd.style.opacity=r; rd.style.transform='translateY('+(18-18*r)+'px)';
    const mn=easeOut(ramp(t,a+1.40,a+2.00));
    const mm=document.querySelector('#s4 .mn');
    mm.style.opacity=mn; mm.style.transform='translateY('+(18-18*mn)+'px)';
  }

  /* 5 마무리 */
  {
    const a=13.40;
    const k=easeOutBack(ramp(t,a,a+0.60));
    document.querySelector('#s5 .m').style.transform='scale('+(0.7+0.3*k)+')';
    const h=easeOut(ramp(t,a+0.25,a+0.85));
    const hh=document.querySelector('#s5 .h');
    hh.style.opacity=h; hh.style.transform='translateY('+(24-24*h)+'px)';
    document.querySelector('#s5 .d').style.opacity=easeOut(ramp(t,a+0.55,a+1.15));
    document.querySelector('#s5 .f').style.opacity=easeOut(ramp(t,a+0.80,a+1.40));
  }
}
seek(0);
</script></body></html>
